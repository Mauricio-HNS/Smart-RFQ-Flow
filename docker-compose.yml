version: "3.9"

services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /app
    volumes:
      - ./:/app
    command: ["dotnet", "run", "--project", "backend/src/SmartRfqFlow.Api/SmartRfqFlow.Api.csproj", "--urls", "http://0.0.0.0:5058"]
    ports:
      - "5058:5058"

  worker:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /app
    volumes:
      - ./:/app
    command: ["dotnet", "run", "--project", "backend/src/SmartRfqFlow.Worker/SmartRfqFlow.Worker.csproj"]
    depends_on:
      - api

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "4173:4173"
    depends_on:
      - api
