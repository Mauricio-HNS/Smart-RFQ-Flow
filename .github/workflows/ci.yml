name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore API
        run: dotnet restore backend/src/SmartRfqFlow.Api/SmartRfqFlow.Api.csproj

      - name: Restore tests
        run: dotnet restore backend/tests/SmartRfqFlow.Tests/SmartRfqFlow.Tests.csproj

      - name: Build API
        run: dotnet build backend/src/SmartRfqFlow.Api/SmartRfqFlow.Api.csproj --no-restore

      - name: Test domain workflow
        run: dotnet test backend/tests/SmartRfqFlow.Tests/SmartRfqFlow.Tests.csproj --no-restore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
